name: Update profile stats

on:
  schedule:
    - cron: "17 * * * *" # every hour (minute 17 avoids the busy top of the hour)
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats cards
        env:
          # Uses your token if you added one, otherwise the default workflow token.
          GH_TOKEN: ${{ secrets.PROFILE_CARDS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/stats.js

      - name: Commit changes (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile stats"
            git push
          fi